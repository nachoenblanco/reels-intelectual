<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reels Intelectual">
<meta name="theme-color" content="#090d16">
<title>Reels intelectual — Ecosistema Comillas</title>
<style>
  :root {
    --bg-dark: #090d16;
    --card-surface: #121927;
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --lab: #38bdf8;
    --atelier: #e879f9;
    --cafe: #fbbf24;
    --herramientas: #34d399;
    --docencia: #818cf8;
  }
  
  /* Bloqueo estricto de desplazamiento horizontal en el viewport */
  html, body {
    width: 100%;
    height: 100%;
    position: fixed;
    inset: 0;
    overflow: hidden !important;
    overscroll-behavior: none !important;
    touch-action: pan-y !important;
    background: var(--bg-dark);
    color: var(--text-primary);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  
  /* Cabecera superior */
  .top-nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    padding: env(safe-area-inset-top, 14px) 16px 8px 16px;
    background: linear-gradient(180deg, rgba(9,13,22,0.98) 0%, rgba(9,13,22,0.7) 75%, transparent 100%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .brand-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo {
    font-size: 0.95rem;
    font-weight: 800;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .logo span {
    color: var(--lab);
    font-size: 1.15rem;
  }
  .streak-pill {
    font-size: 0.72rem;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 3px 10px;
    border-radius: 20px;
    color: #e2e8f0;
    font-weight: 600;
  }
  
  /* Filtros horizontales */
  .filter-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    touch-action: pan-x !important;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex-shrink: 0;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 20px;
    background: rgba(255,255,255,0.06);
    color: var(--text-muted);
    border: 1px solid rgba(255,255,255,0.08);
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-chip.active {
    background: #ffffff;
    color: #090d16;
    border-color: #ffffff;
    font-weight: 700;
  }
  
  /* Contenedor vertical de Reels */
  .reels-container {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%;
    height: 100%;
    overflow-x: hidden !important;
    overflow-y: scroll !important;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    overscroll-behavior-x: none !important;
    touch-action: pan-y !important;
  }
  
  /* Tarjeta individual de Reel */
  .reel-card {
    width: 100%;
    max-width: 100%;
    height: 100%;
    min-height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    position: relative;
    overflow-x: hidden !important;
    touch-action: pan-y !important;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 16px 20px calc(env(safe-area-inset-bottom, 20px) + 22px) 20px;
    background: radial-gradient(circle at 50% 25%, #151e33 0%, var(--bg-dark) 85%);
  }
  
  /* Ambientes de color según temática */
  .cat-lab { background: radial-gradient(circle at 50% 25%, #0d2847 0%, #08111e 85%); }
  .cat-atelier { background: radial-gradient(circle at 50% 25%, #341245 0%, #170921 85%); }
  .cat-cafe { background: radial-gradient(circle at 50% 25%, #38210c 0%, #170e06 85%); }
  .cat-herramientas { background: radial-gradient(circle at 50% 25%, #0d3628 0%, #061711 85%); }
  .cat-docencia { background: radial-gradient(circle at 50% 25%, #171847 0%, #0a0b21 85%); }
  
  /* Ventana de previsualización visual (Hero Preview) */
  .preview-hero {
    position: absolute;
    top: 92px;
    left: 16px;
    right: 16px;
    bottom: 220px;
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 16px 36px rgba(0,0,0,0.5);
  }
  
  /* Hero 1: Miniatura de YouTube */
  .yt-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .yt-backdrop {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: blur(25px) brightness(0.35);
    transform: scale(1.15);
  }
  .yt-main-img {
    position: relative;
    z-index: 2;
    max-width: 95%;
    max-height: 85%;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  .yt-play-btn {
    position: absolute;
    z-index: 3;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(239, 68, 68, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(239, 68, 68, 0.5);
    color: #ffffff;
    font-size: 1.6rem;
    padding-left: 4px;
  }
  
  /* Hero 2: Portada académica simulada (Papers y Preprints) */
  .paper-sheet {
    width: 92%;
    height: 94%;
    background: #fcfcfd;
    color: #1e293b;
    border-radius: 8px;
    padding: 22px 18px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: left;
    position: relative;
    overflow: hidden;
  }
  .paper-sheet::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
  }
  .paper-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 8px;
  }
  .paper-journal-tag {
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.4px;
    color: #0284c7;
    text-transform: uppercase;
  }
  .paper-id-pill {
    font-size: 0.62rem;
    font-family: monospace;
    color: #475569;
    background: #f1f5f9;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
  }
  .paper-title-serif {
    font-family: "Georgia", "Times New Roman", serif;
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.35;
    color: #0f172a;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin: 10px 0;
  }
  .paper-desc-snippet {
    font-size: 0.74rem;
    line-height: 1.45;
    color: #475569;
    font-style: italic;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .paper-bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #e2e8f0;
    padding-top: 8px;
    font-size: 0.64rem;
    font-weight: 600;
    color: #64748b;
  }
  .paper-badge-pdf {
    color: #dc2626;
    font-weight: 700;
  }
  
  /* Hero 3: Separata editorial (Ensayos y Libros) */
  .editorial-sheet {
    width: 92%;
    height: 94%;
    background: radial-gradient(circle at top left, #2a241e 0%, #181411 100%);
    border: 1px solid rgba(251, 191, 36, 0.25);
    border-radius: 12px;
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: left;
    box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    position: relative;
  }
  .editorial-tag {
    font-size: 0.7rem;
    font-weight: 800;
    color: #fbbf24;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .editorial-quote {
    font-size: 1.8rem;
    line-height: 1;
    color: rgba(251, 191, 36, 0.35);
    font-family: "Georgia", serif;
  }
  .editorial-title {
    font-family: "Georgia", "Times New Roman", serif;
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.4;
    color: #fef3c7;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .editorial-meta {
    font-size: 0.68rem;
    color: #a8a29e;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 8px;
  }
  
  /* Hero 4: Tarjeta de entorno de trabajo o herramienta */
  .tool-sheet {
    width: 92%;
    height: 94%;
    background: radial-gradient(circle at top, #11261d 0%, #091410 100%);
    border: 1px solid rgba(52, 211, 153, 0.25);
    border-radius: 14px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 14px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  .tool-icon {
    width: 54px;
    height: 54px;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  .tool-domain-pill {
    font-size: 0.72rem;
    font-weight: 700;
    color: #34d399;
    background: rgba(52, 211, 153, 0.15);
    padding: 4px 10px;
    border-radius: 20px;
  }
  .tool-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  
  /* Hero 5: GitHub OpenGraph y Genérico */
  .github-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  
  /* Cuerpo del Reel */
  .reel-body {
    max-width: 80%;
    z-index: 10;
    margin-bottom: 6px;
  }
  .badge-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.4px;
    padding: 4px 10px;
    border-radius: 6px;
    margin-bottom: 8px;
    backdrop-filter: blur(8px);
    background: rgba(255,255,255,0.1);
  }
  .cat-lab .badge-tag { color: var(--lab); background: rgba(56, 189, 248, 0.15); }
  .cat-atelier .badge-tag { color: var(--atelier); background: rgba(232, 121, 249, 0.15); }
  .cat-cafe .badge-tag { color: var(--cafe); background: rgba(251, 191, 36, 0.15); }
  .cat-herramientas .badge-tag { color: var(--herramientas); background: rgba(52, 211, 153, 0.15); }
  .cat-docencia .badge-tag { color: var(--docencia); background: rgba(129, 140, 248, 0.15); }
  
  .reel-title {
    font-size: 1.22rem;
    font-weight: 700;
    line-height: 1.35;
    color: #ffffff;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .reel-source {
    font-size: 0.75rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  /* Botón de apertura directa */
  .open-link-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #ffffff;
    color: #090d16;
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 0.88rem;
    font-weight: 700;
    text-decoration: none;
    margin-top: 8px;
    box-shadow: 0 8px 20px rgba(255,255,255,0.18);
    transition: transform 0.15s ease;
  }
  .open-link-cta:active { transform: scale(0.96); }
  
  /* Botonera vertical de acciones con el pulgar */
  .side-actions {
    position: absolute;
    right: 14px;
    bottom: calc(env(safe-area-inset-bottom, 20px) + 20px);
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .side-btn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 1.2rem;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
  }
  .side-btn:active {
    transform: scale(0.85);
    background: rgba(255,255,255,0.3);
  }
  .side-btn-label {
    font-size: 0.62rem;
    font-weight: 700;
    color: #e2e8f0;
    margin-top: 2px;
    text-align: center;
  }
  
  /* Notificación flotante (toast) */
  .toast {
    position: fixed;
    top: 105px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(15, 23, 42, 0.94);
    border: 1px solid rgba(255,255,255,0.2);
    color: #ffffff;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 0.82rem;
    font-weight: 600;
    pointer-events: none;
    opacity: 0;
    transition: all 0.25s ease;
    z-index: 100;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>

// Bloqueo estricto del eje horizontal (cero desvío lateral con el pulgar)
let touchStartX = 0;
let touchStartY = 0;
window.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener('touchmove', e => {
  if (e.target.closest('.filter-bar')) return; // Permitir scroll en los chips horizontales
  const deltaX = Math.abs(e.touches[0].clientX - touchStartX);
  const deltaY = Math.abs(e.touches[0].clientY - touchStartY);
  if (deltaX > deltaY) {
    e.preventDefault(); // Anular cualquier movimiento lateral en las tarjetas
  }
}, { passive: false });

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function renderReels() {
  const container = document.getElementById('reels-container');
  container.innerHTML = '';

  let filtered = ALL_ITEMS.filter(it => !quarantinedIds.has(it.id) && !consumedIds.has(it.id));
  if (activeFilter !== 'todos') {
    filtered = filtered.filter(it => it.category === activeFilter);
  }

  // Barajado aleatorio para sesión fresca
  filtered = filtered.sort(() => Math.random() - 0.5);

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="reel-card" style="justify-content:center; align-items:center; text-align:center;">
        <div style="font-size:3rem; margin-bottom:12px;">🎉</div>
        <h2 style="font-size:1.3rem; font-weight:700; margin-bottom:8px;">Todo explorado</h2>
        <p style="color:var(--text-muted); font-size:0.85rem;">Has revisado o archivado todos los enlaces disponibles en esta categoría.</p>
      </div>
    `;
    return;
  }

  filtered.forEach(it => {
    const meta = CAT_META[it.category] || { label: it.category, class: 'cat-lab' };
    const card = document.createElement('div');
    card.className = `reel-card ${meta.class}`;
    card.id = `reel-${it.id}`;

    let previewHtml = '';

    if (it.content_type === 'youtube') {
      const imgSrc = it.thumb_img || 'https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg';
      previewHtml = `
        <div class="preview-hero">
          <div class="yt-container">
            <div class="yt-backdrop" style="background-image: url('${imgSrc}')"></div>
            <img src="${imgSrc}" class="yt-main-img" alt="Miniatura de vídeo" loading="lazy">
            <div class="yt-play-btn">▶</div>
          </div>
        </div>
      `;
    } else if (it.content_type === 'github' && it.thumb_img) {
      previewHtml = `
        <div class="preview-hero">
          <img src="${it.thumb_img}" class="github-img" alt="Repositorio GitHub" loading="lazy">
        </div>
      `;
    } else if (it.content_type === 'paper') {
      previewHtml = `
        <div class="preview-hero">
          <div class="paper-sheet">
            <div class="paper-top-row">
              <span class="paper-journal-tag">${it.tag}</span>
              <span class="paper-id-pill">${it.sub_id || 'Investigación'}</span>
            </div>
            <div class="paper-title-serif">${it.title}</div>
            <div class="paper-desc-snippet">Literatura académica en neurociencia cognitiva, modelado bayesiano e inferencia activa.</div>
            <div class="paper-bottom-row">
              <span class="paper-badge-pdf">📄 Acceso al documento</span>
              <span>Revisión académica</span>
            </div>
          </div>
        </div>
      `;
    } else if (it.content_type === 'essay') {
      previewHtml = `
        <div class="preview-hero">
          <div class="editorial-sheet">
            <div class="editorial-tag">${it.tag}</div>
            <div class="editorial-quote">“</div>
            <div class="editorial-title">${it.title}</div>
            <div class="editorial-meta">Reflexión, ensayo y columnas de análisis crítico.</div>
          </div>
        </div>
      `;
    } else if (it.content_type === 'tool') {
      const favicon = it.thumb_img || '';
      previewHtml = `
        <div class="preview-hero">
          <div class="tool-sheet">
            <div class="tool-icon">
              <img src="${favicon}" width="36" height="36" alt="Icono" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%2232%22 height=%2232%22><text y=%2224%22 font-size=%2224%22>🛠️</text></svg>'">
            </div>
            <div class="tool-domain-pill">${it.domain || 'Herramienta web'}</div>
            <div class="tool-title">${it.title}</div>
          </div>
        </div>
      `;
    } else {
      const favicon = it.thumb_img || '';
      previewHtml = `
        <div class="preview-hero">
          <div class="tool-sheet" style="background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); border-color: rgba(255,255,255,0.1);">
            <div class="tool-icon">
              <img src="${favicon}" width="36" height="36" alt="Icono" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%2232%22 height=%2232%22><text y=%2224%22 font-size=%2224%22>🌐</text></svg>'">
            </div>
            <div class="tool-domain-pill" style="color:#94a3b8; background:rgba(255,255,255,0.08);">${it.domain || 'Recurso web'}</div>
            <div class="tool-title">${it.title}</div>
          </div>
        </div>
      `;
    }

    card.innerHTML = `
      ${previewHtml}

      <div class="reel-body">
        <div class="badge-tag">${it.tag}</div>
        <h2 class="reel-title">${it.title || it.url}</h2>
        <div class="reel-source">
          <span>Fuente: ${it.source}</span>
          <span>•</span>
          <span>Afinidad: ${Math.round((it.confidence || 0.8) * 100)}%</span>
        </div>
        <a href="${it.url}" target="_blank" class="open-link-cta" onclick="markRead('${it.id}', false)">
          Abrir contenido ↗
        </a>
      </div>

      <div class="side-actions">
        <div style="display:flex; flex-direction:column; align-items:center;">
          <button class="side-btn" onclick="markRead('${it.id}', true)">✅</button>
          <span class="side-btn-label">Leído</span>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center;">
          <button class="side-btn" onclick="markQuarantine('${it.id}')">📦</button>
          <span class="side-btn-label">Cuarentena</span>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center;">
          <button class="side-btn" onclick="markSave('${it.id}')">⭐</button>
          <span class="side-btn-label">Investigar</span>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center;">
          <button class="side-btn" onclick="nextReel()">⏩</button>
          <span class="side-btn-label">Pasar</span>
        </div>
      </div>
    `;

    container.appendChild(card);
  });
}

function nextReel() {
  const container = document.getElementById('reels-container');
  container.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
}

function markRead(id, advance) {
  consumedIds.add(id);
  localStorage.setItem('reels_consumed_ids', JSON.stringify(Array.from(consumedIds)));
  consumedCount++;
  localStorage.setItem('reels_consumed_count', consumedCount);
  document.getElementById('stats-counter').innerText = consumedCount + ' leídos hoy';
  showToast('✅ Marcado como leído');
  if (advance) nextReel();
}

function markQuarantine(id) {
  quarantinedIds.add(id);
  localStorage.setItem('reels_quarantined_ids', JSON.stringify(Array.from(quarantinedIds)));
  showToast('📦 Puesto en cuarentena (ropa vieja)');
  nextReel();
}

function markSave(id) {
  promotedIds.add(id);
  localStorage.setItem('reels_promoted_ids', JSON.stringify(Array.from(promotedIds)));
  showToast('⭐ Priorizado para investigación (Zotero)');
  nextReel();
}

function filterCategory(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderReels();
  document.getElementById('reels-container').scrollTo({ top: 0, behavior: 'smooth' });
}

// Iniciar al cargar
renderReels();
</script>

</body>
</html>
